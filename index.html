<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuku Kienyeji</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f4f7f6;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            flex-direction:column;
        }

        .loader{
            width:55px;
            height:55px;
            border:6px solid #ddd;
            border-top:6px solid #0077b6;
            border-radius:50%;
            animation:spin 1s linear infinite;
        }

        @keyframes spin{
            to{transform:rotate(360deg);}
        }

        h3{
            margin-top:20px;
            color:#0077b6;
        }

        p{
            color:#666;
            margin-top:8px;
        }
    </style>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbzOz6796PgIIiXhel6I9pGJKuuwdSitUTP_pA_XgG0cSPuVYMafQ-xqqN2Wl3kVpAvsZw/exec";

        // Peleka mtumiaji moja kwa moja kwenye Apps Script
        window.location.replace(APP_URL);

        // Kama redirect imekwama kwa zaidi ya sekunde 5
        setTimeout(function(){

            document.getElementById("status").innerHTML = `
                <p>Ukurasa umechelewa kufunguka.</p>

                <a href="${APP_URL}"
                   style="
                    display:inline-block;
                    margin-top:15px;
                    padding:12px 22px;
                    background:#0077b6;
                    color:white;
                    text-decoration:none;
                    border-radius:8px;
                    font-weight:bold;">
                    Fungua Mfumo
                </a>
            `;

        },5000);
    </script>

</head>

<body>

<div class="loader"></div>

<h3>Inafungua Mfumo...</h3>

<div id="status">
<p>Tafadhali subiri...</p>
</div>

</body>
</html>
